# Near-real-time booster on top of the Vercel daily crons (GitHub Actions is free):
#   every 30 min  → refresh all job sources
#   every 3 h     → next AI agent mission
#   daily 01:15   → hidden companies + newly funded startups scan
#   daily 02:45 UTC (08:15 IST) → email digest (skips if Vercel cron already sent it)
#   every 6 h     → self-heal (un-park engines that work again, clear stale AI cooldowns, refresh if stale)
# Needs ONE repo secret: Settings → Secrets and variables → Actions → New repository secret
#   CRON_SECRET  = same value as CRON_SECRET in Vercel → Settings → Environment Variables
#   APP_URL      = optional (defaults to https://fde-job-finder.vercel.app)
# Without CRON_SECRET the run is skipped with a warning instead of failing (no failure emails).
name: refresh-jobs
on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '10 */3 * * *'
    - cron: '15 1 * * *'
    - cron: '45 2 * * *'
    - cron: '50 */6 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'refresh | agent | discover | digest | heal | health | semantic'
        default: 'refresh'
concurrency:
  group: refresh-jobs-${{ github.event.schedule || github.event.inputs.task || 'refresh' }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TASK: ${{ github.event.inputs.task }}
        run: |
          APP_URL="${APP_URL:-https://fde-job-finder.vercel.app}"
          APP_URL="${APP_URL%/}"
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning title=CRON_SECRET missing::Skipped. Add repo secret CRON_SECRET (same value as on Vercel) to turn on the 30-min refresh. The app still refreshes via Vercel crons."
            exit 0
          fi
          TASK="${INPUT_TASK:-refresh}"
          if [ "$SCHEDULE" = "10 */3 * * *" ]; then TASK=agent; fi
          if [ "$SCHEDULE" = "15 1 * * *" ]; then TASK=discover; fi
          if [ "$SCHEDULE" = "45 2 * * *" ]; then TASK=digest; fi
          if [ "$SCHEDULE" = "50 */6 * * *" ]; then TASK=heal; fi
          echo "task=$TASK"
          # self-healing: retry cold starts / 5xx / timeouts with backoff
          for attempt in 1 2 3; do
            code=$(curl -s -o out.json -w "%{http_code}" --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron?task=$TASK" || echo 000)
            head -c 2000 out.json 2>/dev/null; echo
            echo "attempt $attempt → HTTP $code"
            # 409 = a run was already in progress; not a failure
            if [ "$code" = "200" ] || [ "$code" = "409" ]; then exit 0; fi
            if [ "$code" = "401" ]; then echo "::error title=Wrong CRON_SECRET::The repo secret CRON_SECRET does not match CRON_SECRET on Vercel. Copy it again from Vercel → Settings → Environment Variables."; exit 1; fi
            sleep $((attempt * 20))
          done
          echo "::error::App did not answer after 3 tries (last HTTP $code)"
          exit 1
