# Near-real-time booster on top of the Vercel daily crons (GitHub Actions is free):
#   every 30 min  → refresh all job sources
#   every 3 h     → next AI agent mission
#   daily 01:15   → hidden companies + newly funded startups scan
#   daily 02:45 UTC (08:15 IST) → email digest (skips if Vercel cron already sent it)
#   every 6 h     → self-heal (un-park engines that work again, clear stale AI cooldowns, refresh if stale)
# No secret to copy: each run gets a short-lived token signed by GitHub (OIDC) and the app checks it came from
# THIS repo's refresh.yml. Optional overrides (repo secrets): CRON_SECRET (used instead of OIDC), APP_URL.
name: refresh-jobs
on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '10 */3 * * *'
    - cron: '15 1 * * *'
    - cron: '45 2 * * *'
    - cron: '50 */6 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'refresh | agent | discover | digest | heal | health | semantic'
        default: 'refresh'
concurrency:
  group: refresh-jobs-${{ github.event.schedule || github.event.inputs.task || 'refresh' }}
  cancel-in-progress: false
permissions:
  id-token: write   # lets the run ask GitHub for its signed identity token
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TASK: ${{ github.event.inputs.task }}
        run: |
          APP_URL="${APP_URL:-https://fde-job-finder.vercel.app}"
          APP_URL="${APP_URL%/}"
          TASK="${INPUT_TASK:-refresh}"
          if [ "$SCHEDULE" = "10 */3 * * *" ]; then TASK=agent; fi
          if [ "$SCHEDULE" = "15 1 * * *" ]; then TASK=discover; fi
          if [ "$SCHEDULE" = "45 2 * * *" ]; then TASK=digest; fi
          if [ "$SCHEDULE" = "50 */6 * * *" ]; then TASK=heal; fi
          echo "task=$TASK"
          # self-healing: retry cold starts / 5xx / timeouts with backoff
          for attempt in 1 2 3; do
            if [ -n "$CRON_SECRET" ]; then AUTH="Authorization: Bearer $CRON_SECRET"
            else
              TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=fde-job-finder-cron" | jq -r .value)
              echo "::add-mask::$TOKEN"
              AUTH="X-GitHub-OIDC: $TOKEN"
            fi
            code=$(curl -s -o out.json -w "%{http_code}" --max-time 300 -H "$AUTH" "$APP_URL/api/cron?task=$TASK" || echo 000)
            head -c 2000 out.json 2>/dev/null; echo
            echo "attempt $attempt → HTTP $code"
            # 409 = a run was already in progress; not a failure
            if [ "$code" = "200" ] || [ "$code" = "409" ]; then exit 0; fi
            if [ "$code" = "401" ]; then echo "::error title=Not authorized::The app refused this run (CRON_SECRET repo secret wrong, or the app's GitHub check failed)."; exit 1; fi
            sleep $((attempt * 20))
          done
          echo "::error::App did not answer after 3 tries (last HTTP $code)"
          exit 1
