use_default_settings: true
general:
  instance_name: "fde-search"
server:
  secret_key: "set-by-SEARXNG_SECRET-env"
  limiter: false
  image_proxy: false
  public_instance: false
search:
  safe_search: 0
  formats:
    - html
    - json
outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 100
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
